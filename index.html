<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Movement Engine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Main Game Window -->
    <div id="game-box">
        <!-- Local Character PNG -->
        <img id="player" src="player.png" alt="Player">

        <!-- Overlay Mobile D-Pad Controls -->
        <div id="controls">
            <button class="btn up" id="btn-up">▲</button>
            <div class="middle-row">
                <button class="btn left" id="btn-left">◀</button>
                <div class="spacer"></div>
                <button class="btn right" id="btn-right">▶</button>
            </div>
            <button class="btn down" id="btn-down">▼</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
